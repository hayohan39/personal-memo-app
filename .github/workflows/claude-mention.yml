name: Claude Mention

# PR/이슈 코멘트에 @claude 를 붙이면 Claude 가 그 지시대로 작업한다.
# PR 리뷰 중 "merge 대신 수정 요청" 을 할 때 쓴다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned, labeled]

jobs:
  claude:
    if: >-
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || github.event.label.name == 'claude'))
    runs-on: ubuntu-latest
    # 사람이 시킨 작업이라 refine·auto-fix 보다 넉넉히 둔다.
    timeout-minutes: 45
    # job 단위로 둔다: workflow 단위면 @claude 가 없는 코멘트(봇 코멘트 포함)의 실행도 같은 그룹에 들어가
    # 대기 중이던 @claude 실행을 밀어내고 취소시킨다. 건너뛴 job 은 그룹에 들어가지 않는다.
    concurrency:
      group: claude-mention-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_PAT || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.BOT_PAT || '' }}
          trigger_phrase: "@claude"
          additional_permissions: |
            actions: read
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --max-turns 60
            --allowed-tools "Bash,Read,Edit,Write,Glob,Grep,mcp__github_ci__get_ci_status,mcp__github_ci__get_workflow_run_details,mcp__github_ci__download_job_log"
