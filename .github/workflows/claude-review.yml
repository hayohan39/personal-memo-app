name: Claude PR Review

# PR 이 열리면 자동 리뷰를 남긴다. 사람이 PR 을 읽고 merge 를 결정하기 전에
# 기계적으로 잡을 수 있는 것을 먼저 걸러내는 단계다.
# 끄려면: gh variable set CLAUDE_REVIEW --body false
on:
  pull_request:
    types: [opened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false
      && github.event.pull_request.head.repo.full_name == github.repository
      && vars.CLAUDE_REVIEW != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # claude-code-action 은 App 토큰을 받을 때 실행 중인 워크플로(이 파일)가 기본 브랜치와 같은지 검사하고,
      # 다르면 아무것도 남기지 않고 '성공' 으로 끝난다. 리뷰가 빠진 이유를 PR 에서 알 수 있게 코멘트를 남긴다.
      - name: Workflow guard
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if git diff --quiet "origin/$BASE...HEAD" -- .github/workflows/claude-review.yml; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "proceed=false" >> "$GITHUB_OUTPUT"
          body=$'<!-- claude-review-skipped -->\n### 🤖 Claude PR 리뷰 건너뜀\n\n이 PR 은 `.github/workflows/claude-review.yml` 을 바꿔서 자동 리뷰를 건너뜁니다. Claude 실행기는 기본 브랜치와 같은 워크플로에서만 돌기 때문입니다 — merge 후 다음 PR 부터 다시 리뷰합니다. 지금 리뷰가 필요하면 `@claude 리뷰해줘` 로 코멘트하세요.'
          # draft → ready 를 오가도 한 번만 남긴다.
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- claude-review-skipped -->"))) | .id' | head -n1)
          [ -n "$existing" ] || gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" >/dev/null

      - uses: anthropics/claude-code-action@v1
        if: steps.guard.outputs.proceed == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          claude_args: |
            --model ${{ vars.CLAUDE_MODEL || 'claude-sonnet-5' }}
            --max-turns 40
            --allowed-tools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-files:*)"
          prompt: |
            이 PR 의 diff 를 리뷰해라. 한국어로 쓴다. 리뷰를 읽는 사람은 이 PR 을
            merge 할지 결정하는 리포지토리 주인이고, 휴대폰으로 읽을 수도 있다.

            맨 위에 3줄 이내 요약: 이 PR 이 무엇을 바꾸는지, merge 하면 사용자에게
            무엇이 달라지는지.

            진행 방법(턴 수가 제한되어 있다):
            - 먼저 `git diff origin/main...HEAD` 를 한 번 실행해 변경 전체를 본다.
              파일을 하나씩 열어 diff 를 다시 확인하지 않는다.
            - 주변 맥락이 꼭 필요할 때만 Read/Grep 으로 해당 부분을 본다.
            - 쓸 수 있는 도구는 Read, Glob, Grep 과 git diff/log/show/status/ls-files 뿐이다.
              npm, cat, ls, gh 같은 다른 명령은 거절되니 시도하지 않는다.

            리뷰할 것, 우선순위대로:
            1. 정확성 버그 — 실제로 깨지는 입력/상태를 특정할 수 있는 것만.
            2. 마이그레이션 — `migrations/` 변경이 있으면 반드시 본다. 기존 데이터가 있는
               프로덕션에서 안전한가(NOT NULL 추가, 컬럼/테이블 삭제, 타입 변경, 긴 락),
               이미 적용된 파일을 수정하지 않았는가, 되돌릴 방법이 있는가.
            3. 보안 — 커밋된 비밀값, SQL 문자열 조합(파라미터 바인딩 미사용), 검증 없는 입력,
               인증 없이 열린 쓰기 API.
            (코드 품질 — 덧붙임·중복·단순화·일관성 — 은 CI 뒤 품질 리뷰(`refine` job)가 따로 본다.
             여기서는 다루지 않는다.)

            규칙:
            - 스타일 취향이나 lint 가 이미 잡는 것은 언급하지 않는다.
            - 지적할 때는 `파일:라인` 과 "이런 입력이면 이렇게 깨진다" 를 같이 쓴다.
            - 문제가 없으면 짧게 "문제 없음" 이라고만 하고 억지로 만들어내지 않는다.
            - 마지막 줄에 `✅ merge 해도 됨` / `✋ 수정 필요` 중 하나를 적는다.
